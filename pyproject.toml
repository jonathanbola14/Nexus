[nexus]
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
    "huggingface-hub>=1.26.0",
    "kokoro>=0.9.4",
    "langchain>=1.3.14",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "noisereduce>=3.0.3",
    "numpy>=2.5.1",
    "onnx-asr>=0.12.0",
    "openwakeword>=0.4.0",
    "pyaudio>=0.2.14",
    "setuptools<81",
    "torch",
    "webrtcvad>=2.0.10",
]

[tool.uv.sources]
torch = { url = "https://download-r2.pytorch.org/whl/cpu/torch-2.13.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl" }
