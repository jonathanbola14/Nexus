[project]
name = "nexus"
dynamic = ["version"]
requires-python = ">=3.11,<3.12"

[dependency-groups]
dev = [
    "deepagents>=0.7.19",
    "dotenv>=0.9.9",
    "firecrawl>=4.45.0",
    "huggingface-hub>=1.26.0",
    "kokoro==0.9.2",
    "langchain>=1.3.14",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "noisereduce>=3.0.3",
    "numpy>=2.4.6",
    "onnx-asr>=0.12.0",
    "openwakeword>=0.4.0",
    "pyaudio>=0.2.14",
    "pyautogui>=0.9.54",
    "pytest>=8.0",
    "setuptools<81",
    "scipy>=1.10",
    "torch",
    "usehid>=0.1.0",
    "webrtcvad>=2.0.10",
]

[tool.setuptools]
packages = ["models", "audios"]

[tool.uv.sources]
torch = { url = "https://download-r2.pytorch.org/whl/cpu/torch-2.13.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl" }
